  Taskavista

  The markup and styles of the agent chat panel, with a tab per chat with an AI agent.

  Author: Mike Bierlee <m.bierlee@lostmoment.com>

<style>
  /* The host takes the panel's width in the page's flow beside <main>, so the
     board reflows to make room rather than going under it; the panel itself
     is fixed, so it stays in view however far the board is scrolled (see
     #placePanel in tv-agent-chat.js). */
  :host {
    --width: 480px;
    flex: none;
    width: var(--width);
  }
  :host(:not([open])) {
    display: none;
  }

  .panel {
    position: fixed;
    top: var(--top, 0);
    right: 0;
    bottom: 0;
    z-index: 5;
    width: var(--width);
    display: flex;
    flex-direction: column;
    background: var(--surface-1);
    border-left: 1px solid var(--border-soft);
  }

  /* Too narrow for the board and the panel side by side. */
  @media (max-width: 720px) {
    :host {
      width: 0;
    }
    .panel {
      width: 100%;
      border-left: 0;
    }
  }

  /* ---------- tabs ---------- */

  .tab-row {
    flex: none;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 10px 0 14px;
    border-bottom: 1px solid var(--border-soft);
  }
  /* Scrolls sideways once there are more tabs than fit, with the + after
     the last of them. */
  .tab-strip {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 16px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs {
    display: flex;
    gap: 16px;
  }

  .tab {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 4px 9px;
    margin-bottom: -1px;
    border-bottom: 2px solid transparent;
  }
  .tab[current] {
    border-bottom-color: var(--accent);
  }
  .tab-name {
    padding: 0;
    border: 0;
    background: none;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    white-space: nowrap;
    cursor: pointer;
  }
  .tab-name:hover {
    color: var(--text-2);
  }
  .tab[current] .tab-name {
    font-weight: 600;
    color: var(--text);
  }
  .tab-close {
    padding: 0;
    border: 0;
    background: none;
    font-size: 11px;
    color: var(--text-dim);
    cursor: pointer;
  }
  .tab[current] .tab-close {
    color: var(--lane-label);
  }
  .tab-close:hover {
    color: var(--text-2);
  }

  .new {
    flex: none;
    padding: 6px 2px;
    border: 0;
    background: none;
    font-size: 17px;
    line-height: 1;
    color: var(--accent);
    cursor: pointer;
  }
  .new:hover {
    color: var(--accent-hover);
  }

  .hide {
    flex: none;
    width: 26px;
    height: 26px;
    font-size: 13px;
    color: var(--lane-label);
  }

  /* ---------- a chat with an agent ---------- */

  .chat,
  .picker {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  /* The agent's name is on its tab, so only its runtime and model are here. */
  .agent-meta {
    flex: none;
    margin: 0;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border-soft);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 12px;
    color: var(--muted);
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 16px;
  }
  .message {
    padding: 9px 12px;
    font-size: 14px;
    line-height: 1.45;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .message.user {
    align-self: flex-end;
    max-width: 82%;
    border-radius: 12px 12px 4px 12px;
    background: var(--surface-active);
    color: var(--text);
  }
  .message.agent {
    align-self: flex-start;
    max-width: 88%;
    border: 1px solid var(--border);
    border-radius: 12px 12px 12px 4px;
    background: var(--surface-input);
    color: var(--text-2);
  }
  /* A message that never reached the agent, or got no answer. */
  .message.error {
    align-self: flex-start;
    max-width: 88%;
    border: 1px solid var(--danger);
    border-radius: 12px 12px 12px 4px;
    background: var(--danger-tint);
    color: var(--danger);
  }
  .empty,
  .waiting {
    margin: 0;
    font-size: 13px;
    color: var(--muted);
  }

  /* ---------- picking an agent ---------- */

  .picker {
    overflow-y: auto;
    gap: 10px;
    padding: 20px 16px;
  }
  .picker h2 {
    margin: 0 0 2px;
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
  }
  .choices {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .choice {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: var(--r-card);
    background: var(--surface-input);
    text-align: left;
    cursor: pointer;
  }
  .choice:hover {
    border-color: var(--muted-2);
  }
  .choice-text {
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
  }
  .choice-name {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
  }
  .choice-label {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .choice-badge {
    flex: none;
    padding: 1px 6px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: var(--disabled-bg);
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
  }

  /* A disabled agent still chats, so it stays on offer, drawn as an outline
     as the settings draw it. */
  .choice.off {
    border-style: dashed;
    border-color: var(--border-dashed);
    background: transparent;
  }
  .choice.off:hover {
    border-color: var(--muted-2);
  }
  .choice.off .choice-name {
    color: var(--text-status);
  }
  .choice-meta {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 12px;
    color: var(--muted);
  }
  .choice-go {
    flex: none;
    font-size: 12px;
    color: var(--accent);
  }
  .picker .status {
    margin: 0;
    font-size: 13px;
    color: var(--muted);
  }

  /* ---------- the message box ---------- */

  .composer {
    flex: none;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 12px 14px;
    border-top: 1px solid var(--border-soft);
  }
  .compose {
    flex: 1;
    min-width: 0;
  }
  .compose::part(field) {
    max-height: 160px;
    overflow-y: auto;
    padding: 8px 12px;
    border-radius: var(--r-ctl);
    background: var(--bg);
    font-size: 14px;
  }
  .compose::part(field):disabled {
    cursor: not-allowed;
  }
  .compose::part(field):disabled::placeholder {
    color: var(--muted-2);
  }

  .send {
    flex: none;
    width: 36px;
    height: 36px;
    padding: 0;
    font-size: 16px;
    font-weight: 600;
  }
  .send:disabled {
    border-color: transparent;
    background: var(--surface-hover);
    color: var(--muted-2);
  }
</style>

<aside class="panel" aria-label="Agent chat">
  <div class="tab-row">
    <div class="tab-strip">
      <div class="tabs" role="tablist" aria-label="Chats"></div>
      <button
        class="new"
        type="button"
        aria-label="New chat"
        title="New chat"
      >
        +
      </button>
    </div>
    <button
      class="btn icon hide"
      type="button"
      aria-label="Hide the chat"
      title="Hide the chat"
    >
      ✕
    </button>
  </div>

  <div class="chat" role="tabpanel" hidden>
    <p class="agent-meta"></p>
    <div class="messages" role="log"></div>
  </div>

  <div class="picker" role="tabpanel" hidden>
    <h2>Who do you want to talk to?</h2>
    <div class="choices"></div>
    <p class="status" hidden></p>
  </div>

  <div class="composer">
    <tv-text-box class="compose"></tv-text-box>
    <button class="btn primary send" type="button" aria-label="Send">↑</button>
  </div>
</aside>

<template class="tab-template">
  <div class="tab">
    <button class="tab-name" type="button" role="tab"></button>
    <button class="tab-close" type="button">✕</button>
  </div>
</template>

<template class="choice-template">
  <button class="choice" type="button">
    <span class="choice-text">
      <span class="choice-name">
        <span class="choice-label"></span>
        <span class="choice-badge" hidden>Disabled</span>
      </span>
      <span class="choice-meta"></span>
    </span>
    <span class="choice-go"></span>
  </button>
</template>
