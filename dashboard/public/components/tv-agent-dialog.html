<style>
  :host {
    display: contents;
  }

  dialog {
    width: min(560px, calc(100vw - 32px));
    padding: 20px;
    border: 1px solid var(--border);
    border-radius: var(--r-dialog);
    background: var(--surface-1);
    box-shadow: var(--shadow-dialog);
    color: var(--text);
    /* The labels' suggestions hang over the rows below them, and would
       otherwise be cut off at the dialog's edge. */
    overflow: visible;
  }
  dialog::backdrop {
    background: var(--backdrop-modal);
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  fieldset {
    display: contents;
  }

  .head {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .title {
    margin: 0;
    font-size: 17px;
    font-weight: 600;
  }
  .close {
    margin: -6px -6px -6px 0;
  }

  .row {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .row-label {
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
  }
  .field {
    width: 100%;
    padding: 9px 12px;
    font-size: 14px;
  }

  .instructions {
    display: block;
    min-height: 92px;
    max-height: 50vh;
    font-size: 13px;
    line-height: 1.5;
    color: var(--text-2);
    resize: vertical;
  }

  /* A native select, for its keyboard handling and its list, with the
     mockup's ▼ drawn over where the browser's arrow was. */
  .select {
    position: relative;
  }
  .select select {
    appearance: none;
    padding-right: 32px;
    color: var(--text-2);
    cursor: pointer;
  }
  .select select:focus {
    background: var(--surface-input);
  }
  .select::after {
    content: "▼";
    position: absolute;
    top: 50%;
    right: 12px;
    transform: translateY(-50%);
    font-size: 11px;
    color: var(--muted);
    pointer-events: none;
  }
  option {
    background: var(--surface-input);
    color: var(--text-2);
  }

  /* Radios, for their keyboard handling, drawn as the mockup's row of
     segments with the one picked filled in. */
  .segments {
    display: flex;
    border: 1px solid var(--border);
    border-radius: var(--r-ctl);
    background: var(--bg);
    overflow: hidden;
  }
  .segment {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    padding: 8px 0;
    font-size: 14px;
    color: var(--text-2);
    cursor: pointer;
  }
  .segment + .segment {
    border-left: 1px solid var(--border);
  }
  .segment:hover:not(:has(:checked)) {
    background: var(--surface-input);
  }
  .segment:has(:checked) {
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 600;
  }
  .segment:has(input[type="radio"]:focus-visible) {
    outline: 2px solid var(--accent-soft);
    outline-offset: -2px;
  }
  .segment input[type="radio"] {
    position: absolute;
    opacity: 0;
    pointer-events: none;
  }
  fieldset:disabled .segment {
    cursor: default;
  }

  .custom {
    flex: 1.6;
    font-size: 13px;
    color: var(--muted);
  }
  /* Picked, "Custom…" turns into the box the number is typed in. */
  .custom-count,
  .custom:has(:checked) .custom-text {
    display: none;
  }
  .custom:has(:checked) {
    padding: 0;
  }
  .custom:has(:checked) .custom-count {
    display: block;
    width: 100%;
    height: 100%;
    padding: 0 8px;
    border: 0;
    background: transparent;
    color: inherit;
    font-size: 14px;
    font-weight: 600;
    text-align: center;
    outline: none;
    appearance: textfield;
  }
  .custom-count::-webkit-inner-spin-button,
  .custom-count::-webkit-outer-spin-button {
    appearance: none;
    margin: 0;
  }
  .custom-count::placeholder {
    color: var(--accent-ink);
    opacity: 0.55;
  }

  /* The mockup puts the switch on the right of its label. */
  tv-toggle {
    flex-direction: row-reverse;
    justify-content: space-between;
    gap: 14px;
  }
  .toggle-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .toggle-name {
    font-size: 14px;
    color: var(--text-2);
  }
  .toggle-hint {
    font-size: 12px;
    color: var(--muted);
  }

  .error {
    margin: 0;
    font-size: 13px;
    color: var(--invalid);
  }

  .foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 16px;
    border-top: 1px solid var(--border-soft);
  }
  /* With no delete button, the others still sit on the right. */
  .actions {
    display: flex;
    gap: 8px;
    margin-left: auto;
  }
  .foot .btn {
    padding: 7px 14px;
    font-size: 13px;
  }
  .foot .delete {
    padding-inline: 12px;
  }
  .foot .cancel {
    color: var(--text-status);
  }
  .foot .save {
    font-weight: 600;
  }
  .foot .save:hover:not(:disabled) {
    background: var(--accent-hover);
  }
</style>

<dialog aria-labelledby="title">
  <form novalidate>
    <div class="head">
      <h2 class="title" id="title">New agent</h2>
      <button class="btn icon close" type="button" aria-label="Close">✕</button>
    </div>

    <fieldset>
      <label class="row">
        <span class="row-label">Name</span>
        <input class="field name" type="text" autocomplete="off" autofocus />
      </label>

      <label class="row">
        <span class="row-label">Runtime</span>
        <span class="select"><select class="field runtime"></select></span>
      </label>

      <label class="row">
        <span class="row-label">Model</span>
        <span class="select"><select class="field model"></select></span>
      </label>

      <label class="row">
        <span class="row-label">Effort</span>
        <span class="select"><select class="field effort"></select></span>
      </label>

      <div class="row">
        <span class="row-label" id="parallel-label">Parallel tasks</span>
        <div
          class="segments parallel"
          role="radiogroup"
          aria-labelledby="parallel-label"
        >
          <label class="segment" title="No limit">
            <input type="radio" name="parallel" value="" />
            <span aria-label="No limit">∞</span>
          </label>
          <label class="segment">
            <input type="radio" name="parallel" value="1" />1
          </label>
          <label class="segment">
            <input type="radio" name="parallel" value="5" />5
          </label>
          <label class="segment">
            <input type="radio" name="parallel" value="10" />10
          </label>
          <label class="segment">
            <input type="radio" name="parallel" value="20" />20
          </label>
          <label class="segment custom">
            <input type="radio" name="parallel" value="custom" />
            <span class="custom-text">Custom…</span>
            <input
              class="custom-count"
              type="number"
              min="1"
              step="1"
              inputmode="numeric"
              aria-label="Parallel tasks"
            />
          </label>
        </div>
      </div>

      <label class="row">
        <span class="row-label">Instructions</span>
        <textarea
          class="field instructions"
          placeholder="Describe what this agent does and how it should work…"
        ></textarea>
      </label>

      <label class="row">
        <span class="row-label">Labels</span>
        <tv-chip-list
          class="labels"
          label="Labels"
          placeholder="Add label…"
          lowercase
        ></tv-chip-list>
      </label>

      <tv-toggle class="scheduler">
        <span class="toggle-text">
          <span class="toggle-name">Task scheduler</span>
          <span class="toggle-hint"
            >Plans and assigns tasks to the other agents</span
          >
        </span>
      </tv-toggle>

      <p class="error" role="alert" hidden></p>

      <div class="foot">
        <button class="btn danger delete" type="button">Delete agent</button>
        <div class="actions">
          <button class="btn secondary cancel" type="button">Cancel</button>
          <button class="btn primary save" type="submit">Add agent</button>
        </div>
      </div>
    </fieldset>
  </form>
</dialog>
