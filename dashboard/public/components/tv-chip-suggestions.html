<style>
  :host {
    display: block;
  }

  /* Positioned, so that the rows' offsetTop is measured from it. */
  .list {
    position: relative;
    display: flex;
    flex-direction: column;
    max-height: 220px;
    overflow-y: auto;
    padding: 4px;
    border: 1px solid var(--border-chip);
    border-radius: var(--r-ctl);
    background: var(--surface-input);
    box-shadow: var(--shadow-popup);
    font-size: 13px;
    color: var(--text-2);
  }

  .option {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 7px 10px;
    border-radius: 6px;
    cursor: pointer;
  }
  .option[aria-selected="true"] {
    background: var(--surface-active);
  }
  .value {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .hint {
    flex: none;
    font-size: 12px;
    color: var(--muted);
  }

  .option.create {
    color: var(--accent);
  }
  /* The divider only separates it from suggestions above it. */
  .option + .option.create {
    margin-top: 2px;
    border-top: 1px solid var(--border);
    border-radius: 0 0 6px 6px;
  }
</style>

<div class="list" role="listbox" aria-label="Suggestions"></div>
