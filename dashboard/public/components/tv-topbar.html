<style>
  :host {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    background: var(--surface-1);
    border-bottom: 1px solid var(--border-soft);
  }

  .left,
  .right {
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .right {
    gap: 10px;
  }

  /* A screen that is about no project, such as the new project screen,
     leaves the switcher out, and the project's page with it. */
  :host([no-switcher]) tv-project-switcher,
  :host([no-switcher]) .open {
    display: none;
  }

  /* Opens the page an agent made in the project's working directory. */
  .open {
    flex: none;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 7px 14px;
    border: 1px solid var(--accent-outline);
    border-radius: 999px;
    font-size: 14px;
    font-weight: 500;
    color: var(--accent);
    text-decoration: none;
    white-space: nowrap;
  }
  .open:hover {
    border-color: var(--accent);
    background: var(--accent-tint-hover);
  }
  .open[hidden] {
    display: none;
  }
  .open svg {
    display: block;
  }

  /* The SVG is cropped to its ink, so this height is the mockup's 21px
     Lexend wordmark (ink 0.8em tall). */
  .wordmark {
    display: block;
    height: 16.8px;
  }

  .search {
    width: 250px;
    font-size: 14px;
    cursor: default;
  }
  .search::placeholder {
    color: var(--muted);
  }

  /* The agent chat button and the gear. */
  .tool {
    position: relative;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: var(--r-ctl);
    background: var(--surface-input);
    font-size: 17px;
    color: var(--lane-label);
    text-decoration: none;
    cursor: pointer;
  }
  .tool:hover {
    background: var(--surface-hover);
    color: var(--text-2);
  }
  /* While the agent chat shows. */
  .chat[aria-expanded="true"] {
    border-color: var(--accent);
    background: var(--accent-tint-strong);
    color: var(--accent-soft);
  }
  .chat svg {
    display: block;
  }

  /* Replies from the agents that have not been read yet. */
  .badge {
    position: absolute;
    top: -6px;
    right: -6px;
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    border: 2px solid var(--surface-1);
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--accent);
    font-size: 11px;
    font-weight: 600;
    color: var(--accent-ink);
  }

  /* On the settings screen itself. */
  .gear[aria-current="page"] {
    border-color: var(--accent);
    background: var(--surface-3);
    color: var(--accent);
  }

  @media (max-width: 720px) {
    :host {
      flex-wrap: wrap;
      gap: 12px;
    }
    .search {
      width: 160px;
    }
  }
</style>

<div class="left">
  <img class="wordmark" src="/wordmark.svg" alt="Taskavista" />
  <tv-project-switcher></tv-project-switcher>
  <a
    class="open"
    target="_blank"
    rel="noopener"
    title="Opens index.html from the project's working dir"
    hidden
  >
    <svg
      width="14"
      height="14"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M14 4h6v6"></path>
      <path d="M20 4l-9 9"></path>
      <path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path>
    </svg>
    Open project
  </a>
</div>
<div class="right">
  <input
    class="field search"
    type="search"
    placeholder="Search all tasks"
    aria-label="Search all tasks"
    title="Search is not part of this screen yet"
    disabled
    hidden
  />
  <button
    class="tool chat"
    type="button"
    aria-label="Agent chat"
    aria-expanded="false"
    title="Agent chat"
  >
    <svg
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.9A8 8 0 1 1 21 12z"></path>
    </svg>
    <span class="badge" hidden></span>
  </button>
  <a
    class="tool gear"
    href="/settings"
    aria-label="Taskavista settings"
    title="Taskavista settings"
    >⚙</a
  >
</div>
