<style>
  :host {
    --card-bg: var(--surface-2);
    display: block;
    background: var(--card-bg);
    border: 1px solid var(--border-card);
    border-radius: var(--r-card);
    padding: 14px;
    font-size: 15px;
    line-height: 1.45;
    color: var(--text-2);
    cursor: grab;
  }
  :host(:hover) {
    border-color: var(--muted-2);
  }
  :host(:active) {
    cursor: grabbing;
  }
  :host(:focus-visible) {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  :host([done]) {
    --card-bg: var(--surface-1);
    background: var(--card-bg);
    border-color: var(--border-soft);
    color: var(--muted);
  }

  /* --lane-color is set on the card's lane, and inherits. */
  :host([selected]) {
    border-color: var(--lane-color, var(--accent));
  }

  /* A task an AI agent is at work on, the task scheduler included, has its
     lane's colour sweeping along its border. The border is a gradient behind
     the card's own background, showing through a transparent border; the
     open card's is tinted with the lane's colour, with the sweep still
     showing over it. */
  :host([working-agent-id]) {
    --wave-base: var(--border-card);
    border-color: transparent;
    background:
      linear-gradient(var(--card-bg), var(--card-bg)) padding-box,
      linear-gradient(
          90deg,
          var(--wave-base) 0%,
          var(--wave-base) 38%,
          var(--lane-color, var(--accent)) 50%,
          var(--wave-base) 62%,
          var(--wave-base) 100%
        )
        border-box;
    background-size:
      100% 100%,
      300% 100%;
    animation: working-wave 2.2s linear infinite;
  }
  :host([working-agent-id][selected]) {
    --wave-base: color-mix(
      in srgb,
      var(--lane-color, var(--accent)) 40%,
      var(--border-card)
    );
  }
  @keyframes working-wave {
    from {
      background-position:
        0 0,
        100% 0;
    }
    to {
      background-position:
        0 0,
        0 0;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    :host([working-agent-id]) {
      animation: none;
      background-position:
        0 0,
        50% 0;
    }
  }

  .agent {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-top: 10px;
    font-size: 12px;
    color: var(--muted);
  }
  .agent[hidden] {
    display: none;
  }
  .ai {
    font-size: 11px;
    font-weight: 600;
    color: var(--accent-ink);
    background: var(--accent);
    border-radius: 4px;
    padding: 1px 6px;
  }

  /* A task just added sweeps a glow in its lane's colour across the card,
     once. The card drops the attribute when the animation ends. */
  :host([added]) {
    background-image: linear-gradient(
      90deg,
      transparent,
      color-mix(in srgb, var(--lane-color, var(--accent)) 28%, transparent),
      transparent
    );
    background-size: 50% 100%;
    background-repeat: no-repeat;
    animation: added-glow 900ms ease-out;
  }
  @keyframes added-glow {
    from {
      background-position: -100% 0;
      border-color: var(--lane-color, var(--accent));
      box-shadow: 0 0 14px
        color-mix(in srgb, var(--lane-color, var(--accent)) 45%, transparent);
    }
    to {
      background-position: 200% 0;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    :host([added]) {
      animation: none;
      background-image: none;
    }
  }

  /* Set by the board once the drag image has been captured, so the
     lifted card is not skewed. */
  :host([dragging]) {
    border-color: var(--accent);
    color: var(--text);
    box-shadow: var(--shadow-lifted);
    transform: rotate(1.2deg);
  }

  /* Set by the board while the card flies to another lane after a move made
     elsewhere. Positioned so it passes over the cards of the lanes between,
     which come later in the page and would otherwise be drawn on top. */
  :host([flying]) {
    position: relative;
    z-index: 1;
    border-color: var(--lane-color, var(--accent));
    box-shadow: var(--shadow-lifted);
  }

  /* Keeps the line breaks a description was written with. It is set on the
     slot rather than the host, where it would also render the whitespace
     between this style element and the slot. */
  slot {
    white-space: pre-wrap;
  }

  /* A long description is cut off on the board; the details panel shows all
     of it. The fade is only drawn when the text overflows, or the last line
     of a description that just fits would fade too. */
  .description {
    max-height: 6lh;
    overflow: hidden;
  }
  .description.clipped {
    mask-image: linear-gradient(to bottom, black 55%, transparent);
  }
</style>
<div class="description"><slot></slot></div>
<div class="agent" hidden><span class="ai">AI</span><span class="name"></span></div>
