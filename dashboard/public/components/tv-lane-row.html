<style>
  :host {
    display: block;
  }
  :host([dragging]) {
    opacity: 0.4;
  }

  /* The columns come from the list, which lines its head up with them. */
  .row {
    position: relative;
    display: grid;
    grid-template-columns: var(--lane-columns);
    align-items: center;
    gap: var(--lane-gap);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--r-ctl);
    padding: 10px 12px;
  }
  /* Where a dragged lane will land: a line in the gap above or below the
     row under the pointer. Nothing moves until the drop. */
  :host([drop-before]) .row::before,
  :host([drop-after]) .row::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    height: 2px;
    border-radius: 1px;
    background: var(--accent);
  }
  :host([drop-before]) .row::before {
    top: -7px;
  }
  :host([drop-after]) .row::after {
    bottom: -7px;
  }

  .handle {
    letter-spacing: 1px;
    cursor: grab;
  }

  .name {
    min-width: 0;
    padding: 2px 4px;
    margin: -2px -4px;
    border: 0;
    border-radius: 4px;
    background: none;
    font-size: 15px;
    color: var(--text);
  }
  .name::placeholder {
    color: var(--text-dim);
  }
  .name:focus {
    outline: 1px solid var(--accent);
  }

  .swatch {
    justify-self: center;
    width: 22px;
    height: 22px;
    padding: 0;
    border: 0;
    border-radius: 6px;
    background: var(--swatch);
    cursor: pointer;
  }
  /* While the colour picker is choosing this lane's colour. */
  :host([picking]) .swatch {
    box-shadow:
      0 0 0 2px var(--surface-2),
      0 0 0 4px var(--accent);
  }

  .flag {
    appearance: none;
    justify-self: center;
    display: grid;
    place-content: center;
    width: 18px;
    height: 18px;
    margin: 0;
    border: 1px solid var(--muted-2);
    border-radius: 4px;
    cursor: pointer;
  }
  .flag:checked {
    border-color: var(--accent);
    background: var(--accent);
  }
  .flag:checked::before {
    content: "✓";
    font-size: 12px;
    font-weight: 700;
    line-height: 16px;
    color: var(--accent-ink);
  }
  .flag:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* Its column stays when there is no count, as in a new project, so the
     rows line up with the list's head; a narrow list gives it no width. */
  .count {
    overflow: hidden;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    text-align: right;
    font-size: 12px;
    color: var(--muted);
  }
  .remove:hover:not(:disabled) {
    color: var(--danger);
  }
</style>

<div class="row">
  <button class="btn ghost handle" type="button">⠿</button>
  <input
    class="name"
    type="text"
    placeholder="Lane name"
    aria-label="Lane name"
    autocomplete="off"
    required
    pattern=".*\S.*"
  />
  <button
    class="swatch"
    type="button"
    aria-haspopup="dialog"
    aria-expanded="false"
  ></button>
  <input class="flag intake" type="checkbox" data-flag="intake" />
  <input class="flag closing" type="checkbox" data-flag="closing" />
  <input class="flag agents" type="checkbox" data-flag="agents" />
  <span class="count"></span>
  <button class="btn ghost remove" type="button">✕</button>
</div>
