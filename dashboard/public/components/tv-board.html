<style>
  /* Fills <main> down to the bottom of the window, and the lanes fill the
     board, so the empty space under a lane's last card is part of that lane:
     a card dropped anywhere down there goes to the bottom of it. */
  :host {
    display: flex;
    flex-direction: column;
    flex: 1;
  }

  .head {
    padding: 22px 24px 14px;
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  /* The h1 keeps its default margins: they are part of the spacing in
     the mockup, which the padding above is measured against. */
  .title {
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.4px;
  }
  .count {
    font-size: 14px;
    color: var(--muted);
  }

  /* The slot is display: contents, so the lanes assigned to it are the
     grid items here. The rows stretch to fill the board, and the lanes
     stretch to fill their row; a lane's contents still sit at its top. */
  .lanes {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 16px;
    padding: 6px 24px 28px;
  }
</style>

<tv-agents-bar></tv-agents-bar>
<header class="head">
  <h1 class="title"></h1>
  <span class="count"></span>
</header>
<div class="lanes"><slot></slot></div>
