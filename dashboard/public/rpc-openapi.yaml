openapi: 3.1.0

info:
  title: Taskavista RPC API
  version: v1
  summary: Operations on Taskavista's projects, lanes, tasks and agents that are not plain CRUD.
  description: |
    Calls that do more than read or write a single resource: moving a task, handing a task back to
    the task scheduler, creating or saving a
    project together with its lanes, pausing a project's agents, chatting with an agent, and
    having an agent draft a new agent or project. The resources themselves are read and written through the REST API, under `/api/rest/v1`.

    Every call follows the same rules:

    - **Always `POST`**, to `/api/rpc/v1/<call>`. Any other method is a 404.
    - **The arguments are the fields of a JSON body.** Nothing goes in the path or the query
      string.
    - **Calls take and return ids and values, never whole resources.** Read the resources a call
      changed from the REST API.
    - **Success is 200** with a JSON result.

    There is no authentication.

    ## Errors

    Failures come back as a JSON object with a single `statusMessage`, as the REST API's do.

    | Status | When |
    |---|---|
    | 400 | A body that is not a JSON object, a required argument missing, an argument of the wrong type, a malformed UUID, or a value the call refuses |
    | 404 | Nothing has an id that was sent, a call that does not exist, or a method other than `POST` |
    | 409 | The call clashes with what is stored: a project slug that is taken or reserved, resuming the agents of a project none of whose lanes has `agentsPickUp`, or rescheduling a task that cannot be |
    | 502 | An agent could not answer a chat message |
    | 503 | The request clashed with another one made at the same time; send it again after the `Retry-After` seconds |
    | 500 | An unexpected server error |

servers:
  - url: /api/rpc/v1
    description: The server serving this document

tags:
  - name: Tasks
    description: Placing tasks on the board, and handing them back to the task scheduler.
  - name: Projects
    description: |
      Saving a project together with its lanes, in one go, pausing or resuming its AI agents, and
      having an AI agent draft a new one. The server makes a project's slug from its name; no
      call takes one.
  - name: Agents
    description: Chatting with an AI agent, and having one draft a new agent.

paths:
  /moveTask:
    post:
      tags: [Tasks]
      operationId: moveTask
      summary: Move a task above another task, or to the bottom of a lane
      description: |
        Moves a task within its lane or to another lane of its project, placed relative to the
        tasks already there rather than by position number.

        With `beforeTaskId`, the moved task takes that task's position, and it and every task
        below it move down one. Without it, or with it `null`, the task goes to the bottom, one
        past the highest position in the lane.

        The move and the shift happen together or not at all. Positions may be left with gaps, so
        rely on the order of tasks, not on their numbers. A lane's `acceptsNewTasks` does not
        apply: it governs creating tasks, not moving them.

        A task that no agent is at, because the task scheduler found no agent for it or its agent
        has finished or failed, is handed back to the scheduler when it moves to another lane
        with `agentsPickUp` that is not a done one, as `rescheduleTask` would; its notes then
        say "Handed back to the task scheduler".

        The result is the lane's order; read the tasks themselves from the REST API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [taskId, laneId]
              properties:
                taskId:
                  $ref: "#/components/schemas/Uuid"
                  description: The task to move.
                laneId:
                  $ref: "#/components/schemas/Uuid"
                  description: The lane to move it to, in the task's project. It may be the lane the task is already in.
                beforeTaskId:
                  type: [string, "null"]
                  format: uuid
                  default: null
                  description: |
                    A task of that lane, other than the one being moved, whose place the moved
                    task takes. Left out or `null`, the task goes after the lane's last task.
            examples:
              before:
                summary: Above another task
                value: { taskId: ad20eea0-2cae-4d5a-a9cd-5af2e0ca4fde, laneId: 8c7f6efa-bb63-41c5-84ba-8fdb08bc964c, beforeTaskId: 76953b10-92be-4e61-92de-86b91dd7bcf0 }
              bottom:
                summary: To the bottom of the lane
                value: { taskId: 76953b10-92be-4e61-92de-86b91dd7bcf0, laneId: 8c7f6efa-bb63-41c5-84ba-8fdb08bc964c, beforeTaskId: null }
      responses:
        "200":
          description: The destination lane and its tasks' order after the move.
          content:
            application/json:
              schema:
                type: object
                required: [laneId, taskIds]
                properties:
                  laneId:
                    $ref: "#/components/schemas/Uuid"
                    description: The destination lane.
                  taskIds:
                    type: array
                    items: { $ref: "#/components/schemas/Uuid" }
                    description: The ids of every task of that lane, in their order after the move.
              examples:
                before:
                  summary: Above another task
                  value: { laneId: 8c7f6efa-bb63-41c5-84ba-8fdb08bc964c, taskIds: [ad20eea0-2cae-4d5a-a9cd-5af2e0ca4fde, 76953b10-92be-4e61-92de-86b91dd7bcf0, 39d20ed2-c3fa-4bae-b54e-2be0b1557541] }
                bottom:
                  summary: To the bottom of the lane
                  value: { laneId: 8c7f6efa-bb63-41c5-84ba-8fdb08bc964c, taskIds: [ad20eea0-2cae-4d5a-a9cd-5af2e0ca4fde, 39d20ed2-c3fa-4bae-b54e-2be0b1557541, 76953b10-92be-4e61-92de-86b91dd7bcf0] }
        "400":
          description: |
            `taskId` or `laneId` missing; the lane belongs to another project; `beforeTaskId` is
            the task being moved, or is not in that lane.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                notInLane:
                  value: { statusMessage: The beforeTaskId task is not in that lane. }
                missing:
                  value: { statusMessage: The argument taskId is missing. }
        "404":
          description: No task has `taskId`, no lane has `laneId`, or no task has `beforeTaskId`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { statusMessage: No task has that id. }
        "503": { $ref: "#/components/responses/Clash" }
        "500": { $ref: "#/components/responses/ServerError" }

  /rescheduleTask:
    post:
      tags: [Tasks]
      operationId: rescheduleTask
      summary: Hand a task back to the task scheduler
      description: |
        A last resort for a task no agent is working on, such as one the task scheduler found no
        agent for. The task is taken off the agent it is assigned to, if any, and the task
        scheduler takes it up again as it does a new task: it chooses an agent for it and the lane
        it moves to, which may differ from last time. That happens shortly after the call, not
        during it; the task's notes (`GET /api/rest/v1/tasks/{id}/notes`) say what came of it.

        It also hands a task to the agents for the first time: one created in a lane without
        `agentsPickUp`, whose `handedToAgents` is `false`, is otherwise never scheduled.

        Only a task in a lane with `agentsPickUp` can be rescheduled, and not one in a done
        lane, nor one the scheduler is choosing an agent for or
        an agent is working on at that moment. A task of a project whose agents are paused waits
        until they are resumed. Rescheduling a task that is
        already waiting for the scheduler is not an error.

        The result is an empty object.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [taskId]
              properties:
                taskId:
                  $ref: "#/components/schemas/Uuid"
                  description: The task to hand back.
            example: { taskId: edf9cef0-a88d-49af-a962-22a8efe8af8f }
      responses:
        "200":
          description: The task is waiting for the task scheduler.
          content:
            application/json:
              schema:
                type: object
              example: {}
        "400":
          description: "`taskId` missing or not a UUID."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { statusMessage: The argument taskId is missing. }
        "404":
          description: No task has `taskId`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { statusMessage: No task has that id. }
        "409":
          description: |
            The task is in a lane without `agentsPickUp` or in a done lane, or the task scheduler
            is choosing an agent for it or an agent is working on it now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                notPickedUp:
                  value: { statusMessage: "The task's lane is not one the AI agents pick up tasks from." }
                done:
                  value: { statusMessage: "The task is in a done lane, so it is done." }
                beingScheduled:
                  value: { statusMessage: The task scheduler is choosing an agent for the task right now. }
                beingWorkedOn:
                  value: { statusMessage: An agent is working on the task right now. }
        "503":
          description: |
            The task kept moving to other lanes meanwhile, or the request clashed with another one
            made at the same time. Nothing was changed. Send it again, after the `Retry-After`
            seconds.
          headers:
            Retry-After:
              description: Seconds to wait before sending the request again.
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { statusMessage: The request clashed with another one made at the same time. Send it again. }
        "500": { $ref: "#/components/responses/ServerError" }

  /clearLane:
    post:
      tags: [Tasks]
      operationId: clearLane
      summary: Delete every task in a lane
      description: |
        Deletes all of the lane's tasks, with their notes, at once: either all of them are deleted
        or none. The lane itself stays, as do the tasks of every other lane. Any lane can be
        cleared, not only a done one, and clearing an empty lane is not an error.

        The result is an empty object.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [laneId]
              properties:
                laneId:
                  $ref: "#/components/schemas/Uuid"
                  description: The lane to empty.
            example: { laneId: 05bf691f-6820-4c77-8b4d-71b6690aeaad }
      responses:
        "200":
          description: The lane has no tasks.
          content:
            application/json:
              schema:
                type: object
              example: {}
        "400":
          description: "`laneId` missing or not a UUID."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { statusMessage: The argument laneId is missing. }
        "404":
          description: No lane has `laneId`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { statusMessage: No lane has that id. }
        "503": { $ref: "#/components/responses/Clash" }
        "500": { $ref: "#/components/responses/ServerError" }

  /createProject:
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a project together with its lanes
      description: |
        Creates a project and its lanes: either all of it is stored or none of it. The slug is
        made from the name, as the REST API makes it when no slug is sent. Whether the project is
        managed by AI, and paused, is not sent either: a project with a lane that has
        `agentsPickUp` is managed by AI and starts with its agents running, and any other is not,
        with them paused.

        The new project's id is not returned; find the project by its slug in the REST API's
        list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { $ref: "#/components/schemas/ProjectName" }
                description:
                  $ref: "#/components/schemas/ProjectDescription"
                  default: ""
                lanes:
                  type: array
                  default: []
                  items: { $ref: "#/components/schemas/NewLane" }
                  description: The lanes in board order; each one's position is its place in the list.
            example: { name: Kite launch, description: Launch the kite range in the spring catalogue., lanes: [{ name: To do, color: "#8FA6FF", acceptsNewTasks: true, agentsPickUp: true }, { name: Done, color: "#5fd6ab", marksDone: true, agentsPickUp: true }] }
      responses:
        "200":
          description: The slug made from the name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SlugResult" }
              example: { slug: kite-launch }
        "400":
          description: |
            `name` missing, blank, or without a letter or digit; a lane with a blank name or a
            malformed colour; a lane with an id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { statusMessage: "A new project's lanes have no ids yet." }
        "409":
          description: |
            Another project already has the slug the name makes, or it is a reserved one (`new`).
            The message refers to the name, not the slug.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { statusMessage: "A project cannot be called “New”. Pick another name." }
        "503": { $ref: "#/components/responses/Clash" }
        "500": { $ref: "#/components/responses/ServerError" }

  /saveProjectSettings:
    post:
      tags: [Projects]
      operationId: saveProjectSettings
      summary: Change a project's name and description, and replace its lanes
      description: |
        Gives a project a name, a description and exactly the lanes sent, in their order. Either the whole of it is saved or nothing is, and that includes a lane
        deleted together with its tasks.

        **A lane of the project that is not in the list is deleted, along with its tasks**, so an
        empty list deletes them all. Lanes may trade places freely: the positions only have to be
        unique once the whole save is done.

        Whether the project is managed by AI, and paused, is not sent: the lanes decide it. A save
        that leaves the project no lane with `agentsPickUp`, when it had one, pauses its agents,
        one that gives it such a lane, when it had none, starts them, and any other save leaves
        them as they were.

        The slug is the server's to decide, and this call takes none. When the name changes, a
        new slug is made from it, so the project's URL changes. When the name stays the same, the
        slug is kept as it is, even if it was not made from the name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId, name, description, lanes]
              properties:
                projectId:
                  $ref: "#/components/schemas/Uuid"
                  description: The project to change.
                name: { $ref: "#/components/schemas/ProjectName" }
                description: { $ref: "#/components/schemas/ProjectDescription" }
                lanes:
                  type: array
                  items: { $ref: "#/components/schemas/SavedLane" }
                  description: |
                    The project's lanes in board order; each one's position is its place in the
                    list. A lane of the project left out is deleted, with its tasks.
            example: { projectId: 08463b1c-e98c-49e8-9d6c-78115d96863b, name: Kite launch v2, description: "Launch the kite range in the spring catalogue, and the kite bags with it.", lanes: [{ id: 27a3b98c-d241-4a63-a180-58f2cc417d14, name: To do, color: "#8fa6ff", acceptsNewTasks: true }, { id: null, name: Backlog, color: "#e8b154", acceptsNewTasks: true }] }
      responses:
        "200":
          description: The project's slug after the save. It differs from the old one only after a rename.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SlugResult" }
              example: { slug: kite-launch-v2 }
        "400":
          description: |
            `projectId`, `name`, `description` or `lanes` missing;
            `name` blank or without a letter or digit; a lane with a blank name or a malformed
            colour; a lane id listed twice; a lane of another project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { statusMessage: A lane is listed twice. }
        "404":
          description: No project has `projectId`, or no lane has one of the lane ids sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { statusMessage: No lane has one of the lane ids sent. }
        "409":
          description: |
            After a rename, another project already has the slug the new name makes, or it is a
            reserved one. The message is put in terms of the name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { statusMessage: "A project called “Website relaunch” already exists. Pick another name." }
        "503": { $ref: "#/components/responses/Clash" }
        "500": { $ref: "#/components/responses/ServerError" }

  /setAiPaused:
    post:
      tags: [Projects]
      operationId: setAiPaused
      summary: Pause a project's AI agents, or resume them
      description: |
        Pauses a project's AI agents, or resumes them, and changes nothing else about the
        project. The REST API serves the project's `aiPaused` read-only; besides this call, only
        the project coming to have a lane with `agentsPickUp`, or losing its last, changes it.
        Only a project with such a lane can be resumed: one without is always paused. Asking for the state the
        project is already in is not an error.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId, paused]
              properties:
                projectId:
                  $ref: "#/components/schemas/Uuid"
                  description: The project whose agents to pause or resume.
                paused:
                  type: boolean
                  description: "`true` pauses them, `false` resumes them."
            example: { projectId: 98359477-3b46-49be-9f29-135c7c2385a9, paused: true }
      responses:
        "200":
          description: Whether the project's agents are paused now.
          content:
            application/json:
              schema:
                type: object
                required: [aiPaused]
                properties:
                  aiPaused:
                    type: boolean
                    description: Whether the project's agents are paused now.
              example: { aiPaused: true }
        "400":
          description: "`projectId` or `paused` missing."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No project has `projectId`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { statusMessage: No project has that id. }
        "409":
          description: "`paused` is `false` and none of the project's lanes has `agentsPickUp`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { statusMessage: "None of the project's lanes is one the AI agents pick up tasks from, so its agents cannot be resumed." }
        "503": { $ref: "#/components/responses/Clash" }
        "500": { $ref: "#/components/responses/ServerError" }

  /setAgentEnabled:
    post:
      tags: [Agents]
      operationId: setAgentEnabled
      summary: Enable or disable an AI agent
      description: |
        Enables or disables an AI agent, and changes nothing else about it. The REST API serves
        the agent's `enabled` read-only; only this call changes it. A disabled agent is given no
        tasks: the task scheduler leaves it out when it chooses one, and a task it was given but
        has not started on goes back to the scheduler. A task it is working on is finished. A
        disabled task scheduler schedules no tasks. A disabled agent can still be chatted with. Asking for the state the agent is already in
        is not an error.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agentId, enabled]
              properties:
                agentId:
                  $ref: "#/components/schemas/Uuid"
                  description: The agent to enable or disable.
                enabled:
                  type: boolean
                  description: "`true` enables it, `false` disables it."
            example: { agentId: 89d18be4-d79e-45a9-953c-b14b301099dd, enabled: false }
      responses:
        "200":
          description: Whether the agent is enabled now.
          content:
            application/json:
              schema:
                type: object
                required: [enabled]
                properties:
                  enabled:
                    type: boolean
                    description: Whether the agent is enabled now.
              example: { enabled: false }
        "400":
          description: "`agentId` or `enabled` missing."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { statusMessage: The argument enabled is missing. }
        "404":
          description: No agent has `agentId`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { statusMessage: No agent has that id. }
        "503": { $ref: "#/components/responses/Clash" }
        "500": { $ref: "#/components/responses/ServerError" }

  /setAllAgentsEnabled:
    post:
      tags: [Agents]
      operationId: setAllAgentsEnabled
      summary: Enable or disable every AI agent
      description: |
        Enables or disables every agent at once, as `setAgentEnabled` does one, and answers with
        the ids of the agents it changed. Agents that were so already are left out of the result,
        so asking for the state every agent is already in is not an error and answers with an
        empty list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
                  description: "`true` enables every agent, `false` disables every agent."
            example: { enabled: false }
      responses:
        "200":
          description: The agents the call changed.
          content:
            application/json:
              schema:
                type: object
                required: [agentIds]
                properties:
                  agentIds:
                    type: array
                    items: { $ref: "#/components/schemas/Uuid" }
                    description: The ids of the agents whose state the call changed.
              example: { agentIds: [572dfae2-69c4-4d29-a3b6-6291d3e53e46, 89d18be4-d79e-45a9-953c-b14b301099dd] }
        "400":
          description: "`enabled` missing."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { statusMessage: The argument enabled is missing. }
        "503": { $ref: "#/components/responses/Clash" }
        "500": { $ref: "#/components/responses/ServerError" }

  /sendChatMessage:
    post:
      tags: [Agents]
      operationId: sendChatMessage
      summary: Send a chat message to an AI agent and get its reply
      description: |
        Sends a person's chat message to an AI agent and answers with the agent's reply. The
        first message, sent without a `sessionId`, starts a chat, and the agent is told which
        project the person is in, and where its working directory is. Every later message, sent
        with the `sessionId` the first one returned, continues that chat, and the agent remembers
        what was said in it. Send the project the chat started in with every message, since the
        agent can reach the project's working directory only when it is sent.

        The call waits for the agent, which can take anywhere from seconds to minutes. Send a
        chat's next message only once the last one is answered, since each one continues the one
        before.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agentId, message]
              properties:
                agentId:
                  $ref: "#/components/schemas/Uuid"
                  description: The agent to send the message to.
                message:
                  type: string
                  minLength: 1
                  description: What the person wrote. Not blank or only whitespace.
                projectId:
                  type: [string, "null"]
                  format: uuid
                  default: null
                  description: |
                    The project the person is in, told to the agent when the chat starts. Left out
                    or `null`, the agent is told the person is in none. With a `sessionId`, the
                    project the chat started in, whose working directory the agent can reach; a
                    project that has since been deleted is passed over rather than answered with a
                    404.
                sessionId:
                  type: [string, "null"]
                  default: null
                  description: |
                    The chat's session, as an earlier answer returned it. Left out or `null`, a
                    new chat starts.
            examples:
              start:
                summary: Starting a chat
                value: { agentId: 00539d3f-0291-4589-89a6-472afa0166cb, message: "My name is Sam. Which project am I in? One line.", projectId: a06eb28a-ff4d-414b-95be-3c661fa3f7f7 }
              continue:
                summary: Continuing it
                value: { agentId: 00539d3f-0291-4589-89a6-472afa0166cb, message: "What is my name?", projectId: a06eb28a-ff4d-414b-95be-3c661fa3f7f7, sessionId: 0b6f2c3e-5d1a-4f7e-9a8b-3c2d1e0f9a7b }
      responses:
        "200":
          description: The agent's reply, and the chat's session.
          content:
            application/json:
              schema:
                type: object
                required: [reply, sessionId]
                properties:
                  reply:
                    type: string
                    description: The agent's answer, without leading or trailing whitespace.
                  sessionId:
                    type: string
                    description: The chat's session; a new one when none was sent, otherwise the one sent.
              examples:
                start:
                  summary: Starting a chat
                  value: { reply: "You're in the project \"AI test\", Sam.", sessionId: 0b6f2c3e-5d1a-4f7e-9a8b-3c2d1e0f9a7b }
                continue:
                  summary: Continuing it
                  value: { reply: Your name is Sam., sessionId: 0b6f2c3e-5d1a-4f7e-9a8b-3c2d1e0f9a7b }
        "400":
          description: "`agentId` or `message` missing, or `message` blank."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { statusMessage: A message cannot be blank. }
        "404":
          description: No agent has `agentId`, or, when no `sessionId` is sent, no project has `projectId`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { statusMessage: No agent has that id. }
        "502":
          description: |
            The agent could not answer: it has no chat `sessionId`, or it failed. The message starts
            with "The agent could not answer:" and goes on with the reason.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/ServerError" }

  /endChat:
    post:
      tags: [Agents]
      operationId: endChat
      summary: End a chat with an AI agent
      description: |
        Ends a chat started with `sendChatMessage`, which can then no longer be continued. When
        the agent is still answering a message in it, the agent is stopped, and that
        `sendChatMessage` call answers with a 502. What the chat kept on the server, such as the
        directory the agent ran in, is removed.

        Ending a chat that has ended already, or that the server does not know, is not an error,
        and neither is one with an agent that has since been deleted, since deleting an agent ends
        its chats. A chat whose first message failed has no session to end.

        The result is an empty object.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agentId, sessionId]
              properties:
                agentId:
                  $ref: "#/components/schemas/Uuid"
                  description: The agent the chat is with.
                sessionId:
                  $ref: "#/components/schemas/Uuid"
                  description: The chat's session, as `sendChatMessage` returned it.
            example: { agentId: 00539d3f-0291-4589-89a6-472afa0166cb, sessionId: 0b6f2c3e-5d1a-4f7e-9a8b-3c2d1e0f9a7b }
      responses:
        "200":
          description: The chat has ended.
          content:
            application/json:
              schema:
                type: object
              example: {}
        "400":
          description: "`agentId` or `sessionId` missing or not a UUID."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { statusMessage: The argument sessionId is missing. }
        "500": { $ref: "#/components/responses/ServerError" }

  /draftAgent:
    post:
      tags: [Agents]
      operationId: draftAgent
      summary: Have an AI agent draft a new agent from a description
      description: |
        Has an AI agent draft a new agent from what a person wrote it should do, and answers
        with the draft's fields, ready to be sent on to `POST /api/rest/v1/agents` once they have
        been reviewed. Nothing is created: the draft is only an answer.

        The draft is made by the agent named "Generic", or, when there is none or it fails, by
        each task scheduler in turn. The call waits for the agent, which usually takes some
        seconds.

        The draft's runtime, model and effort level always go together: when the agent's do
        not, the defaults (`GET /api/rest/v1/defaults`) are given instead. Its labels are
        lowercase and unique. Its name is not checked against the other agents', so it may be
        taken.

        When no draft can be made, the answer is still a 200, holding only an `error`: either
        the description does not say enough, or no agent could draft one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description]
              properties:
                description:
                  type: string
                  minLength: 1
                  description: What the new agent should do, in the person's own words. Not blank or only whitespace.
            example: { description: "Something that writes the release notes every time we ship, from the tasks that were done since the last release. Should be thorough." }
      responses:
        "200":
          description: The draft, or an `error` saying why there is none.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    title: Draft
                    required: [name, runtime, model, effort, instructions, labels, taskScheduler]
                    properties:
                      name:
                        type: string
                        description: The agent's name, not blank.
                      runtime:
                        type: string
                        description: The id of the runtime it would run in.
                      model:
                        type: string
                        description: The id of its model, one the runtime offers.
                      effort:
                        type: string
                        description: The id of its effort level, one the model takes.
                      instructions:
                        type: string
                        description: Its own instructions, written to it; empty for none.
                      labels:
                        type: array
                        items: { type: string }
                        description: Its specialties, lowercase and unique; empty for none.
                      taskScheduler:
                        type: boolean
                        description: Whether it would choose which agent works on each new task.
                  - type: object
                    title: No draft
                    required: [error]
                    properties:
                      error:
                        type: string
                        description: Why there is no draft, in a sentence fit to show the person.
              examples:
                draft:
                  summary: A draft
                  value:
                    name: Release Notes Writer
                    runtime: claude-code
                    model: sonnet
                    effort: default
                    instructions: |-
                      You write the release notes every time the team ships a release, based on the tasks that were done since the last release.

                      Be thorough. Work out when the last release was and which tasks have been completed since then (a task is done when it sits in a lane that marks tasks as done). Read each of those tasks in full, including its description and notes, so that nothing that shipped is missed or misdescribed. Cover every completed task in the release notes, grouping related changes under clear headings and describing each change in terms of what it means for the people who use the product. Do not invent changes, details or tasks that are not in the board, and if a task is unclear, say so rather than guessing.
                    labels: [release notes, writing, releases]
                    taskScheduler: false
                vague:
                  summary: A description that says too little ("hmm")
                  value: { error: "The description (\"hmm\") does not say what the agent should do." }
        "400":
          description: "`description` missing or blank."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                blank:
                  summary: Blank
                  value: { statusMessage: A description cannot be blank. }
                missing:
                  summary: Missing
                  value: { statusMessage: The argument description is missing. }
        "500": { $ref: "#/components/responses/ServerError" }

  /draftProject:
    post:
      tags: [Projects]
      operationId: draftProject
      summary: Have an AI agent draft a new project from a description
      description: |
        Has an AI agent draft a new project from what a person wrote they are working on, and
        answers with the draft's fields, ready to be sent on to `createProject` once they have
        been reviewed. Nothing is created: the draft is only an answer.

        The draft is made by the agent named "Generic", or, when there is none or it fails, by
        each task scheduler in turn. The call waits for the agent, which usually takes some
        seconds.

        Every lane has a name and one of the standard lane colours, as a lowercase hex code: a
        lane the agent gave no name is dropped, and one it gave any other colour gets a
        standard one instead. With more lanes than standard colours, some lanes share one. The draft's name is not checked against the other projects', so it may be
        taken.

        When no draft can be made, the answer is still a 200, holding only an `error`: the
        description does not say enough, or no agent could draft one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description]
              properties:
                description:
                  type: string
                  minLength: 1
                  description: What the project is, in the person's own words. Not blank or only whitespace.
            example: { description: "Relaunching our marketing site by December: new pricing page, blog migration, faster load times. Every change gets reviewed by legal before it goes live." }
      responses:
        "200":
          description: The draft, or an `error` saying why there is none.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    title: Draft
                    required: [name, description, lanes]
                    properties:
                      name:
                        type: string
                        description: The project's name, not blank.
                      description:
                        type: string
                        description: What the project is about; empty for none.
                      lanes:
                        type: array
                        minItems: 1
                        description: The lanes, in board order.
                        items:
                          type: object
                          required: [name, color, marksDone, acceptsNewTasks, agentsPickUp]
                          properties:
                            name:
                              type: string
                              description: The lane's name, not blank.
                            color:
                              type: string
                              pattern: "^#[0-9a-f]{6}$"
                              description: The lane's colour.
                            marksDone:
                              type: boolean
                              description: Whether a task in the lane is done.
                            acceptsNewTasks:
                              type: boolean
                              description: Whether a task can be created in the lane.
                            agentsPickUp:
                              type: boolean
                              description: |
                                Whether the AI agents would work on the tasks in the lane. A draft
                                with any such lane is for a project managed by AI.
                  - type: object
                    title: No draft
                    required: [error]
                    properties:
                      error:
                        type: string
                        description: Why there is no draft, in a sentence fit to show the person.
              examples:
                draft:
                  summary: A draft
                  value:
                    description: Relaunch the marketing site by December, with a new pricing page, the blog migrated, and faster load times. Every change gets reviewed by legal before it goes live.
                    lanes:
                      - { color: "#8fa6ff", marksDone: false, acceptsNewTasks: true, agentsPickUp: false, name: To do }
                      - { color: "#e8b154", marksDone: false, acceptsNewTasks: false, agentsPickUp: false, name: In progress }
                      - { color: "#5fd6ab", marksDone: true, acceptsNewTasks: false, agentsPickUp: false, name: Done }
                    name: Marketing Site Relaunch
                vague:
                  summary: A description that says too little ("hmm")
                  value: { error: "The description does not say what the project is about." }
                noAgent:
                  summary: No agent named Generic, and no task scheduler
                  value: { error: "There is no agent to suggest one with. Add an agent named Generic, or a task scheduler, or set the project up manually." }
        "400":
          description: "`description` missing or blank."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                blank:
                  summary: Blank
                  value: { statusMessage: A description cannot be blank. }
                missing:
                  summary: Missing
                  value: { statusMessage: The argument description is missing. }
        "500": { $ref: "#/components/responses/ServerError" }

components:
  schemas:
    Uuid:
      type: string
      format: uuid
      examples: [8c7f6efa-bb63-41c5-84ba-8fdb08bc964c]

    Color:
      description: A web colour, `#` and six hex digits. Uppercase is accepted and returned lowercased; the three-digit short form is not.
      type: string
      pattern: "^#[0-9A-Fa-f]{6}$"
      examples: ["#8fa6ff"]

    ProjectName:
      type: string
      minLength: 1
      description: At least one letter or digit, in any script, as the REST API requires.
      examples: [Kite launch]

    ProjectDescription:
      type: string
      description: |
        What the project is about, and directions for the AI agents that work on it. Free text,
        over as many lines as needed; empty for none.
      examples: [Launch the kite range in the spring catalogue.]

    NewLane:
      description: A lane of a new project, with the same rules as a lane in the REST API.
      type: object
      required: [name, color]
      properties:
        id:
          type: "null"
          description: Absent or `null`; a new project's lanes have no ids yet.
        name:
          type: string
          minLength: 1
          description: Not blank or only whitespace.
          examples: [To do]
        color: { $ref: "#/components/schemas/Color" }
        marksDone:
          type: boolean
          default: false
          description: Whether the tasks in this lane count as done.
        acceptsNewTasks:
          type: boolean
          default: false
          description: Whether a task can be created in this lane.
        agentsPickUp:
          type: boolean
          default: false
          description: |
            Whether the AI agents work on the tasks in this lane. A project with any lane that
            sets it is managed by AI.

    SavedLane:
      description: A lane of the project being saved, with the same rules as a lane in the REST API.
      type: object
      required: [name, color]
      properties:
        id:
          type: [string, "null"]
          format: uuid
          description: |
            The id of a lane the project already has, or absent or `null` for a lane the save
            adds. Each id may be listed once.
        name:
          type: string
          minLength: 1
          description: Not blank or only whitespace.
          examples: [To do]
        color: { $ref: "#/components/schemas/Color" }
        marksDone:
          type: boolean
          default: false
          description: Whether the tasks in this lane count as done.
        acceptsNewTasks:
          type: boolean
          default: false
          description: Whether a task can be created in this lane.
        agentsPickUp:
          type: boolean
          default: false
          description: |
            Whether the AI agents work on the tasks in this lane. A project with any lane that
            sets it is managed by AI.

    SlugResult:
      type: object
      required: [slug]
      properties:
        slug:
          type: string
          description: The project's slug, which is its URL.
          examples: [kite-launch]

    Error:
      type: object
      required: [statusMessage]
      properties:
        statusMessage:
          type: string
          description: What went wrong, in a sentence.

  responses:
    Clash:
      description: |
        The request clashed with another one made at the same time and was not carried out. Send
        it again, after the `Retry-After` seconds.
      headers:
        Retry-After:
          description: Seconds to wait before sending the request again.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { statusMessage: The request clashed with another one made at the same time. Send it again. }
    ServerError:
      description: An unexpected server error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
